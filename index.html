<!doctype html>
<!--
  index.html – THE ONLY PAGE OF THE WEBSITE
  It holds four "views", and only one is shown at a time:
    1. loading   – shown for a moment while the site starts
    2. login     – email + password form
    3. inactive  – shown when an account is not switched on yet
    4. app       – the menu and the screen you are using
  All the work is done by the files in the js folder (starting with js/app.js).
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1f4e79">
  <title>Printex</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- The Supabase library (fixed version, loaded from a trusted CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>

  <!-- 1. LOADING -->
  <section id="view-loading" class="view center-page">
    <p class="muted">Loading…</p>
  </section>

  <!-- 2. LOGIN -->
  <section id="view-login" class="view center-page" hidden>
    <form id="login-form" class="card login-card" novalidate>
      <h1 class="brand-big">Printex</h1>
      <p class="muted">Sign in to continue</p>

      <div id="setup-notice" class="notice error" hidden></div>

      <label for="login-email">Email</label>
      <input id="login-email" type="email" autocomplete="email" inputmode="email" required>

      <label for="login-password">Password</label>
      <input id="login-password" type="password" autocomplete="current-password" required>

      <label class="checkbox">
        <input id="login-show-password" type="checkbox"> Show password
      </label>

      <div id="login-message" class="notice error" role="alert" hidden></div>

      <button id="login-button" type="submit" class="button primary wide">Sign in</button>
    </form>
  </section>

  <!-- 3. ACCOUNT NOT ACTIVE -->
  <section id="view-inactive" class="view center-page" hidden>
    <div class="card login-card">
      <h1 class="brand-big">Printex</h1>
      <p>Your account is not active yet. Please contact the owner.</p>
      <button type="button" class="button wide sign-out">Sign out</button>
    </div>
  </section>

  <!-- 4. THE APP (menu + screen) -->
  <section id="view-app" class="view" hidden>
    <header class="topbar">
      <button id="menu-toggle" type="button" class="button icon-button" aria-expanded="false"
              aria-controls="menu" aria-label="Open menu">☰</button>
      <span class="brand">Printex</span>
      <span id="user-name" class="user-name"></span>
      <button type="button" class="button small sign-out">Sign out</button>
    </header>
    <div class="layout">
      <nav id="menu" class="menu" aria-label="Main menu"></nav>
      <main id="screen" class="screen"></main>
    </div>
  </section>

</body>
</html>
